<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Aprende inglés palabra por palabra, con ejemplos, audio y quizzes cada 5, 20 y 50 palabras." />
    <meta name="theme-color" content="#1d5bd8" />
    <title>The English Teacher</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('tet-progress') || '{}')
        var t = (s.state && s.state.settings && s.state.settings.theme) || 'system'
        var host = document.documentElement.getAttribute('data-theme')
        var dark = t === 'system' ? (host ? host === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) : t === 'dark'
        if (dark) document.documentElement.classList.add('dark')
        else if (t === 'light') document.documentElement.classList.add('light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
